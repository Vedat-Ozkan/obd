[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hil-bridge"
version = "0.1.0"
description = "OBD hardware-in-the-loop bridge"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
]

[project.scripts]
hil-bridge = "hil_bridge.app:main"

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hil_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
